services:
  postgres:
    image: postgres:17-alpine
    container_name: saas-clinicas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_clinicas
      POSTGRES_PASSWORD: saas_clinicas
      POSTGRES_DB: saas_clinicas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas_clinicas -d saas_clinicas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
